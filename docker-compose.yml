services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://budget:budget@postgres:5432/budget
      PORT: "3000"
    volumes:
      - ./references:/app/references:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
